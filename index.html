<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>4th-Axis Rotary CNC Simulator — Unrolled Toolpaths → Synchronized X/Z/A</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Ccircle cx='8' cy='8' r='6' fill='none' stroke='%2338bdf8' stroke-width='2'/%3E%3Ccircle cx='8' cy='8' r='2' fill='%234ade80'/%3E%3C/svg%3E" />
<link rel="stylesheet" href="./styles.css" />
<!-- Vendored Three.js r186 (offline-capable). -->
<script type="importmap">
{
  "imports": {
    "three": "./vendor/three/three.module.js",
    "three/addons/": "./vendor/three/addons/"
  }
}
</script>
</head>
<body>
<header id="topbar">
  <div class="brand">
    <span class="logo">◠</span>
    <div>
      <h1>4th-Axis Rotary Lathe / Router Simulator</h1>
      <p>Unrolled 2D toolpath planning → synchronized X/Z/A G-code</p>
    </div>
  </div>
  <nav id="viewtabs" aria-label="viewport">
    <button id="tab-3d" class="tab active">3D Rotary View</button>
    <button id="tab-2d" class="tab">Unrolled 2D Flat View</button>
    <button id="tab-split" class="tab">Split</button>
  </nav>
</header>

<div id="app">
  <!-- ================= left: control panel ================= -->
  <aside id="panel">
    <section>
      <h2>Stock</h2>
      <label>Length (mm)<input type="number" id="num-len" min="10" max="360" step="1" value="200"></label>
      <label>Diameter (mm)<input type="number" id="num-dia" min="6" max="120" step="0.5" value="50"></label>
    </section>

    <section>
      <h2>Design</h2>
      <label>Profile<select id="sel-profile"></select></label>
      <label>Surface pattern<select id="sel-pattern"></select></label>
      <label>Grooves ×<input type="number" id="num-pcount" min="2" max="40" step="1" value="8"></label>
      <label>Spiral turns<input type="number" id="num-pturns" min="0" max="12" step="0.5" value="2"></label>
      <label>Pattern depth (R₀×)<input type="number" id="num-pdepth" min="0" max="0.9" step="0.01" value="0.22"></label>
      <label class="stacked">Custom design (JSON)
        <textarea id="ta-custom" rows="4" spellcheck="false"
          placeholder='{ "profile": [[0,25],[80,18],[140,22],[200,10]], "pattern": "spiral", "patternCount": 6 }'></textarea>
      </label>
      <button id="btn-custom" class="wide">Apply Custom Design</button>
      <div class="btn-row">
        <button id="btn-import" title="Load your own STL or OBJ (binary or ASCII)">Import STL/OBJ</button>
        <button id="btn-demoleg" title="assets/table-leg.stl — procedurally generated baroque leg">Demo: baroque leg</button>
      </div>
      <input type="file" id="file-mesh" accept=".stl,.obj" hidden>
    </section>

    <section>
      <h2>Tool</h2>
      <label>Cutter<select id="sel-tool">
        <option value="flat">Flat Endmill</option>
        <option value="ball" selected>Ball-Nose Endmill</option>
      </select></label>
      <label>Diameter (mm)<input type="number" id="num-tool-d" min="0.5" max="25" step="0.5" value="6"></label>
      <label>Stepover (mm)<input type="number" id="num-stepover" min="0.25" max="15" step="0.25" value="2"></label>
      <label>Depth of cut (mm)<input type="number" id="num-doc" min="0.25" max="12" step="0.25" value="3"></label>
      <label>Finish allowance (mm)<input type="number" id="num-allow" min="0" max="3" step="0.05" value="0.2"></label>
    </section>

    <section>
      <h2>Machining Strategy</h2>
      <label>Roughing<select id="sel-rough">
        <option value="">— off —</option>
        <option value="spiral" selected>Spiral (helical roughing)</option>
        <option value="indexed">Indexed (faceting sweeps)</option>
      </select></label>
      <label>Spiral pitch (mm/rev)<input type="number" id="num-roughpitch" min="0.5" max="20" step="0.5" value="4"></label>
      <label id="lbl-indexes">Index count N<input type="number" id="num-indexes" min="3" max="72" step="1" value="12"></label>
      <label>Finishing<select id="sel-finish">
        <option value="helical" selected>Continuous helical</option>
        <option value="raster">Raster (parallel 2D passes)</option>
      </select></label>
      <label>Helix pitch (mm/rev)<input type="number" id="num-pitch" min="0.25" max="20" step="0.25" value="3"></label>
      <label>A sample step (deg)<input type="number" id="num-astep" min="0.5" max="10" step="0.25" value="2"></label>
    </section>

    <section>
      <h2>Feeds (mm/min)</h2>
      <div class="grid3">
        <label>Rough<input type="number" id="num-frough" min="10" max="10000" step="10" value="1200"></label>
        <label>Finish<input type="number" id="num-ffinish" min="10" max="10000" step="10" value="800"></label>
        <label>Rapid<input type="number" id="num-frapid" min="100" max="20000" step="100" value="4000"></label>
      </div>
    </section>

    <section class="actions">
      <button id="btn-generate" class="primary wide">⚙ Generate Toolpath</button>
      <button id="btn-export" class="wide">⬇ Export G-code (.nc)</button>
    </section>
  </aside>

  <!-- ================= center: viewport + transport ================= -->
  <main id="center">
    <div id="viewport" class="show-3d">
      <div id="v3d"></div>
      <div id="v2d"></div>
      <div id="overlay-toggles">
        <label class="master" title="Master switch for every toolpath trace (P)"><input type="checkbox" id="chk-paths" checked> toolpath</label>
        <label class="sub"><input type="checkbox" id="chk-p-rough" checked> rough</label>
        <label class="sub"><input type="checkbox" id="chk-p-finish" checked> finish</label>
        <label class="sub"><input type="checkbox" id="chk-p-rapid"> rapids</label>
        <label><input type="checkbox" id="chk-ghost" checked> target ghost</label>
        <span id="dblhint">dbl-click: re-frame · P: paths</span>
      </div>
    </div>

    <div id="transport">
      <button id="btn-reset" title="Reset (material restored)">⏮</button>
      <button id="btn-back" title="Step back one block">◀▮</button>
      <button id="btn-play" class="play" title="Play / Pause (Space)">▶</button>
      <button id="btn-fwd" title="Step forward one block">▮▶</button>
      <span class="sl-label">Speed</span>
      <input type="range" id="sl-speed" min="0" max="9" step="1" value="4">
      <span id="sp-speed" class="mono">2×</span>
      <input type="range" id="sl-scrub" min="0" max="1000" step="1" value="0" class="scrub">
      <span id="lbl-time" class="mono">00:00 / 00:00</span>
    </div>
  </main>

  <!-- ================= right: DRO + terminal + stats ================= -->
  <aside id="side">
    <section id="dro">
      <div class="dro-row"><span>X</span><b id="dro-x">0.0</b></div>
      <div class="dro-row"><span>Z</span><b id="dro-z">0.0</b></div>
      <div class="dro-row"><span>A</span><b id="dro-a">0.0°</b></div>
      <div class="dro-row"><span>F</span><b id="dro-f">0</b></div>
    </section>

    <section class="grow">
      <h2>G-code</h2>
      <div id="term" class="mono"></div>
    </section>

    <section id="stats">
      <div class="stat"><span>Blocks</span><b id="lbl-nblocks">0</b></div>
      <div class="stat"><span>Cut distance</span><b id="lbl-cutdist">0 mm</b></div>
      <div class="stat"><span>Est. time</span><b id="lbl-est">0:00</b></div>
      <div class="stat"><span>Removed</span><b id="lbl-removed">0 cm³</b></div>
    </section>

    <div id="status"></div>
    <div id="collide-warn" hidden></div>
  </aside>
</div>

<script type="module" src="./src/main.js"></script>
</body>
</html>
